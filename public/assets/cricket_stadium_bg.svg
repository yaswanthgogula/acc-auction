<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Midnight Atmospheric Sky -->
    <linearGradient id="stadiumSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#01040a" />
      <stop offset="25%" stop-color="#050e24" />
      <stop offset="50%" stop-color="#0a1a44" />
      <stop offset="75%" stop-color="#0f2b69" />
      <stop offset="100%" stop-color="#040b17" />
    </linearGradient>

    <!-- Towering Floodlight Volumetric Beams -->
    <linearGradient id="beamLeft1" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="20%" stop-color="#bfdbfe" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamRight1" x1="100%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="20%" stop-color="#bfdbfe" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamCrossLeft" x1="5%" y1="0%" x2="65%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamCrossRight" x1="95%" y1="0%" x2="35%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>

    <!-- Floodlight Core Glow Flare -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="15%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#1d4ed8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Striped Cricket Outfield Turf Gradient -->
    <radialGradient id="outfieldGrass" cx="50%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#15803d" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#166534" stop-opacity="0.98" />
      <stop offset="85%" stop-color="#0f3d20" stop-opacity="1" />
      <stop offset="100%" stop-color="#051f0f" stop-opacity="1" />
    </radialGradient>

    <!-- 22-Yard Clay Cricket Pitch Strip -->
    <linearGradient id="clayPitch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Stadium Stands LED Ribbon Ribbon Gradient -->
    <linearGradient id="ledRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="25%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="stadiumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Night Sky -->
  <rect width="1920" height="1080" fill="url(#stadiumSky)" />

  <!-- Atmospheric Sky Haze & Stadium Mist -->
  <ellipse cx="960" cy="540" rx="900" ry="380" fill="#1e3a8a" opacity="0.25" filter="url(#stadiumGlow)" />
  <ellipse cx="960" cy="380" rx="600" ry="200" fill="#38bdf8" opacity="0.18" filter="url(#stadiumGlow)" />

  <!-- Stadium Structural Arches & Roof Truss -->
  <path d="M 0,220 Q 960,-60 1920,220 L 1920,380 Q 960,140 0,380 Z" fill="#0b1329" stroke="#1e293b" stroke-width="2" />
  <path d="M 0,240 Q 960,-30 1920,240" stroke="#38bdf8" stroke-width="2.5" opacity="0.45" fill="none" />
  <path d="M 0,290 Q 960,40 1920,290" stroke="#60a5fa" stroke-width="1.5" opacity="0.3" fill="none" />

  <!-- Stadium Tier 3 (Upper Grandstands & Crowd Lights) -->
  <path d="M 0,340 Q 960,190 1920,340 L 1920,440 Q 960,310 0,440 Z" fill="#070d1d" />
  <g opacity="0.35">
    <circle cx="240" cy="320" r="2.5" fill="#ffffff" />
    <circle cx="380" cy="310" r="2" fill="#fde047" />
    <circle cx="520" cy="290" r="3" fill="#ffffff" />
    <circle cx="710" cy="270" r="2.5" fill="#93c5fd" />
    <circle cx="890" cy="260" r="3" fill="#ffffff" />
    <circle cx="1080" cy="260" r="2.5" fill="#ffffff" />
    <circle cx="1260" cy="270" r="3" fill="#fde047" />
    <circle cx="1450" cy="290" r="2.5" fill="#ffffff" />
    <circle cx="1620" cy="310" r="2" fill="#93c5fd" />
    <circle cx="1780" cy="330" r="2.5" fill="#ffffff" />
  </g>

  <!-- Stadium Tier 2 (Middle Deck & Executive Boxes) -->
  <path d="M 0,430 Q 960,300 1920,430 L 1920,530 Q 960,420 0,530 Z" fill="#040914" />
  <path d="M 280,410 Q 960,320 1640,410" stroke="#fbbf24" stroke-width="3" opacity="0.45" stroke-dasharray="25,12" fill="none" />

  <!-- LED Perimeter Display Ribbon Ribbon -->
  <path d="M 0,520 Q 960,415 1920,520 L 1920,545 Q 960,440 0,545 Z" fill="url(#ledRibbon)" opacity="0.85" filter="url(#stadiumGlow)" />
  <text x="960" y="475" text-anchor="middle" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="15" letter-spacing="12" opacity="0.9">
    ★ AVANTHI CRICKET CARNIVAL 2026 ★ OFFICIAL PLAYER AUCTION ★ TALENT BUILDS CHAMPIONS ★
  </text>

  <!-- Outfield -->
  <ellipse cx="960" cy="980" rx="1150" ry="560" fill="url(#outfieldGrass)" />
  <ellipse cx="960" cy="980" rx="980" ry="470" fill="none" stroke="#22c55e" stroke-width="35" opacity="0.15" />
  <ellipse cx="960" cy="980" rx="830" ry="390" fill="none" stroke="#15803d" stroke-width="40" opacity="0.25" />
  <ellipse cx="960" cy="980" rx="670" ry="310" fill="none" stroke="#22c55e" stroke-width="35" opacity="0.18" />
  <ellipse cx="960" cy="980" rx="510" ry="230" fill="none" stroke="#15803d" stroke-width="40" opacity="0.25" />

  <!-- Boundary & Creases -->
  <ellipse cx="960" cy="960" rx="1020" ry="485" fill="none" stroke="#f8fafc" stroke-width="3.5" opacity="0.65" />
  <ellipse cx="960" cy="850" rx="420" ry="160" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="14,10" opacity="0.45" />

  <!-- Pitch Strip -->
  <polygon points="915,740 1005,740 1030,940 890,940" fill="url(#clayPitch)" stroke="#ca8a04" stroke-width="1.5" />
  <line x1="905" y1="765" x2="1015" y2="765" stroke="#ffffff" stroke-width="2" opacity="0.9" />
  <line x1="885" y1="915" x2="1035" y2="915" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />
  <line x1="960" y1="740" x2="960" y2="940" stroke="#b45309" stroke-width="1" opacity="0.35" />

  <!-- Beams -->
  <polygon points="120,40 160,40 960,920 620,920" fill="url(#beamLeft1)" />
  <polygon points="100,50 140,50 1400,940 1000,940" fill="url(#beamCrossLeft)" />
  <polygon points="1800,40 1760,40 960,920 1300,920" fill="url(#beamRight1)" />
  <polygon points="1820,50 1780,50 520,940 920,940" fill="url(#beamCrossRight)" />

  <!-- Pylons -->
  <g transform="translate(130, 60)">
    <line x1="0" y1="0" x2="-30" y2="280" stroke="#334155" stroke-width="4" />
    <line x1="0" y1="0" x2="30" y2="280" stroke="#334155" stroke-width="4" />
    <rect x="-45" y="-35" width="90" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <circle cx="-30" cy="-20" r="10" fill="url(#lampGlow)" />
    <circle cx="-10" cy="-20" r="10" fill="url(#lampGlow)" />
    <circle cx="10" cy="-20" r="10" fill="url(#lampGlow)" />
    <circle cx="30" cy="-20" r="10" fill="url(#lampGlow)" />
    <circle cx="-30" cy="0" r="10" fill="url(#lampGlow)" />
    <circle cx="-10" cy="0" r="10" fill="url(#lampGlow)" />
    <circle cx="10" cy="0" r="10" fill="url(#lampGlow)" />
    <circle cx="30" cy="0" r="10" fill="url(#lampGlow)" />
    <ellipse cx="0" cy="-10" rx="95" ry="50" fill="#ffffff" opacity="0.75" filter="url(#stadiumGlow)" />
  </g>
  <g transform="translate(1790, 60)">
    <line x1="0" y1="0" x2="-30" y2="280" stroke="#334155" stroke-width="4" />
    <line x1="0" y1="0" x2="30" y2="280" stroke="#334155" stroke-width="4" />
    <rect x="-45" y="-35" width="90" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <circle cx="-30" cy="-20" r="10" fill="url(#lampGlow)" />
    <circle cx="-10" cy="-20" r="10" fill="url(#lampGlow)" />
    <circle cx="10" cy="-20" r="10" fill="url(#lampGlow)" />
    <circle cx="30" cy="-20" r="10" fill="url(#lampGlow)" />
    <circle cx="-30" cy="0" r="10" fill="url(#lampGlow)" />
    <circle cx="-10" cy="0" r="10" fill="url(#lampGlow)" />
    <circle cx="10" cy="0" r="10" fill="url(#lampGlow)" />
    <circle cx="30" cy="0" r="10" fill="url(#lampGlow)" />
    <ellipse cx="0" cy="-10" rx="95" ry="50" fill="#ffffff" opacity="0.75" filter="url(#stadiumGlow)" />
  </g>
</svg>
